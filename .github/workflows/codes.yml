name: HoYoLAB gift codes

on:
  schedule:
    - cron: "30 */6 * * *"   # 每 6 小時，直播碼通常只有效 1 天
  workflow_dispatch:

permissions: {}

concurrency:
  group: codes
  cancel-in-progress: false

jobs:
  codes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find new codes
        run: python3 codes.py
        env:
          ACCOUNTS: ${{ vars.ACCOUNTS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- codes.json || [ -n "$(git ls-files --others --exclude-standard codes.json)" ]; then
            git add codes.json
            git commit -m "Update announced codes [skip ci]"
            git pull --rebase
            git push
          fi
