name: HoYoLAB redeem codes

on:
  schedule:
    - cron: "30 */6 * * *"   # 每 6 小時，直播碼通常只有效 1 天
  workflow_dispatch:

permissions: {}

concurrency:
  group: redeem
  cancel-in-progress: false

jobs:
  redeem:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Redeem codes
        run: python3 redeem.py
        env:
          HOYOLAB_REDEEM_COOKIE: ${{ secrets.HOYOLAB_REDEEM_COOKIE }}
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GAMES: gi,hsr
          HOYOLAB_LANG: zh-tw
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- redeemed.json || [ -n "$(git ls-files --others --exclude-standard redeemed.json)" ]; then
            git add redeemed.json
            git commit -m "Update redeemed codes [skip ci]"
            git pull --rebase
            git push
          fi
